<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .sol-panel { flex: 3; }
        .sag-panel { flex: 1; background: #f4f4f4; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="sol-panel">
        <h1>Borsa Canlı Takip</h1>
        <table>
            <thead><tr><th>Hisse</th><th>Fiyat (TL)</th><th>İşlem</th></tr></thead>
            <tbody id="tablo-govde">
                <tr><td>ASELS</td><td id="fiyat-ASELS">52.65</td><td><button onclick="portfoyeEkle('ASELS', 52.65)">Ekle</button></td></tr>
                <tr><td>THYAO</td><td id="fiyat-THYAO">310.50</td><td><button onclick="portfoyeEkle('THYAO', 310.50)">Ekle</button></td></tr>
                <tr><td>GARAN</td><td id="fiyat-GARAN">95.73</td><td><button onclick="portfoyeEkle('GARAN', 95.73)">Ekle</button></td></tr>
                <tr><td>BIMAS</td><td id="fiyat-BIMAS">147.40</td><td><button onclick="portfoyeEkle('BIMAS', 147.40)">Ekle</button></td></tr>
            </tbody>
        </table>
    </div>

    <div class="sag-panel">
        <h3>Piyasa Verileri</h3>
        <p>Altın: <span id="altin">2458.08</span> TL</p>
    </div>

    <script>
        // Borsa kapalı olsa bile tabloyu hareketli tutan simülasyon
        setInterval(() => {
            document.querySelectorAll('td[id^="fiyat-"]').forEach(td => {
                let mevcutFiyat = parseFloat(td.innerText);
                let degisim = (Math.random() - 0.5) * 0.5; // Fiyatı ufak oynat
                td.innerText = (mevcutFiyat + degisim).toFixed(2);
            });
        }, 3000);

        function portfoyeEkle(sembol, fiyat) {
            let lot = prompt(sembol + " için kaç lot aldın?");
            let maliyet = prompt("Maliyet fiyatın neydi?");
            if (lot && maliyet) {
                let karZarar = (fiyat - maliyet) * lot;
                alert(sembol + " için kâr/zarar durumun: " + karZarar.toFixed(2) + " TL");
            }
        }
    </script>
</body>
</html>
