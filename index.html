<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .sol-panel { flex: 3; }
        .sag-panel { flex: 1; background: #f4f4f4; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="sol-panel">
        <h1>Borsa Canlı Takip</h1>
        <table id="borsa-tablo">
            <thead><tr><th>Hisse</th><th>Fiyat (TL)</th><th>İşlem</th></tr></thead>
            <tbody id="tablo-govde"></tbody>
        </table>
    </div>

    <div class="sag-panel">
        <h3>Piyasa Verileri</h3>
        <p>Altın: <span id="altin">Yükleniyor...</span></p>
    </div>

    <script>
        // Hisselerin Yahoo Finance sembolleri (BIST için .IS eklenir)
        let semboller = ["ASELS.IS", "THYAO.IS", "GARAN.IS", "BIMAS.IS"];

        async function veriCek() {
            // Ücretsiz bir finans verisi proxy servisi kullanıyoruz
            for (let sembol of semboller) {
                try {
                    let response = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${sembol}`);
                    let data = await response.json();
                    let fiyat = data.chart.result[0].meta.regularMarketPrice;
                    
                    document.getElementById(`fiyat-${sembol}`).innerText = fiyat.toFixed(2);
                } catch (e) {
                    console.log("Veri çekilemedi, bir sonraki güncelleme bekleniyor.");
                }
            }
        }

        // Tabloyu ilk kez oluştur
        let govde = document.getElementById("tablo-govde");
        semboller.forEach(s => {
            govde.innerHTML += `<tr><td>${s.replace('.IS', '')}</td><td id="fiyat-${s}">--</td><td><button>Ekle</button></td></tr>`;
        });

        // Verileri her 1 dakikada bir güncelle
        setInterval(veriCek, 60000);
        veriCek();
    </script>
</body>
</html>
