<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .ara-kutusu { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1>BİST Hisse Listesi</h1>
    <input type="text" id="ara" placeholder="Hisse ara (Örn: THYAO)..." onkeyup="filtrele()">

    <table>
        <thead><tr><th>Hisse</th><th>İşlem</th></tr></thead>
        <tbody id="tablo-govde"></tbody>
    </table>

    <script>
        // BIST hisselerinin bir kısmı (Hepsini listelemek yerine arama özelliği ekledik)
        const bistHisseleri = ["ASELS", "THYAO", "GARAN", "BIMAS", "EREGL", "TUPRS", "SISE", "AKBNK", "PETKM", "KCHOL", "SAHOL"];

        function tabloyuDoldur(liste) {
            let govde = document.getElementById("tablo-govde");
            govde.innerHTML = "";
            liste.forEach(h => {
                govde.innerHTML += `<tr><td>${h}</td><td><button onclick="ekle('${h}')">Ekle</button></td></tr>`;
            });
        }

        function filtrele() {
            let aranan = document.getElementById("ara").value.toUpperCase();
            let filtrelenmis = bistHisseleri.filter(h => h.includes(aranan));
            tabloyuDoldur(filtrelenmis);
        }

        tabloyuDoldur(bistHisseleri);
    </script>
</body>
</html>
