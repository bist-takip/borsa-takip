<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .panel { flex: 1; background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>Kripto Canlı Takip</h1>
        <table>
            <thead><tr><th>Coin</th><th>Fiyat (USD)</th></tr></thead>
            <tbody id="kripto-tablo">
                <tr id="BTC"><td>Bitcoin (BTC)</td><td class="fiyat">Yükleniyor...</td></tr>
                <tr id="ETH"><td>Ethereum (ETH)</td><td class="fiyat">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Binance'in herkese açık canlı veri kaynağı
        async function kriptoVeriCek() {
            try {
                let res = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT"]');
                let veriler = await res.json();
                
                document.querySelector('#BTC .fiyat').innerText = parseFloat(veriler[0].price).toFixed(2);
                document.querySelector('#ETH .fiyat').innerText = parseFloat(veriler[1].price).toFixed(2);
            } catch (e) {
                console.log("Veri çekilemedi.");
            }
        }

        // Her 2 saniyede bir güncelle
        setInterval(kriptoVeriCek, 2000);
        kriptoVeriCek();
    </script>
</body>
</html>
