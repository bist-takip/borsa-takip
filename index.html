<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Borsa ve Portföy Takip</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .up { color: green; font-weight: bold; }
        .down { color: red; font-weight: bold; }
        .add-btn { cursor: pointer; color: blue; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Borsa Canlı Takip</h1>
        <div id="portfoy-ozeti" style="padding:10px; background:#e8f4fd; border-radius:8px; margin-bottom:15px;">
            Toplam Kar/Zarar: Henüz hisse eklenmedi.
        </div>
        <table>
            <thead>
                <tr><th>Hisse</th><th>Fiyat</th><th>Değişim (%)</th><th>İşlem</th></tr>
            </thead>
            <tbody id="borsa-tablo">
                <!-- Burası canlı gelecek -->
                <tr><td>ASELS</td><td>65.20</td><td class="up">+1.2%</td><td class="add-btn" onclick="portfoyeEkle('ASELS', 65.20)">Ekle</td></tr>
                <tr><td>THYAO</td><td>310.50</td><td class="down">-0.5%</td><td class="add-btn" onclick="portfoyeEkle('THYAO', 310.50)">Ekle</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function portfoyeEkle(hisse, fiyat) {
            let lot = prompt(hisse + " için lot sayısını gir:");
            let maliyet = prompt("Maliyet fiyatını gir:");
            if(lot && maliyet) {
                alert(hisse + " portföye eklendi! (Yakında anlık hesaplama aktif olacak)");
                // Buraya localstorage ile kayıt fonksiyonları gelecek
            }
        }
    </script>
</body>
</html>
