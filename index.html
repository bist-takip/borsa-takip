<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .sol-panel { flex: 3; }
        .sag-panel { flex: 1; background: #f4f4f4; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <div class="sol-panel">
        <h1>Borsa Canlı Takip</h1>
        <table id="borsa-tablo">
            <thead>
                <tr><th>Hisse</th><th>Fiyat</th><th>İşlem</th></tr>
            </thead>
            <tbody id="tablo-govde">
                </tbody>
        </table>
    </div>

    <div class="sag-panel">
        <h3>Piyasa Verileri</h3>
        <p>Gram Altın: <span id="altin">Yükleniyor...</span></p>
    </div>

    <script>
        // Hisseler ve Sembolleri
        let hisseler = [
            { sembol: "ASELS", fiyat: 0 },
            { sembol: "THYAO", fiyat: 0 },
            { sembol: "GARAN", fiyat: 0 },
            { sembol: "BIMAS", fiyat: 0 }
        ];

        // 1. ADIM: Alfabetik Sıralama
        hisseler.sort((a, b) => a.sembol.localeCompare(b.sembol));

        // 2. ADIM: Tabloya Yazdırma
        function tabloyuGuncelle() {
            let govde = document.getElementById("tablo-govde");
            govde.innerHTML = "";
            hisseler.forEach(h => {
                govde.innerHTML += `<tr><td>${h.sembol}</td><td>${h.fiyat}</td><td><button>Ekle</button></td></tr>`;
            });
        }

        // 3. ADIM: Canlı Veri Simülasyonu (Gerçek API bağlamak için burayı güncelleyeceğiz)
        function veriCek() {
            hisseler.forEach(h => {
                h.fiyat = (Math.random() * 100 + 50).toFixed(2);
            });
            tabloyuGuncelle();
        }

        setInterval(veriCek, 3000);
        veriCek();
    </script>
</body>
</html>
